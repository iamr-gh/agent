name: Code quality

on:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Offline application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Check out agent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: agent
          persist-credentials: false
      - name: Check out the public llm-api sibling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: iamr-gh/llm-api
          ref: 6ea1b814337db78da7d4a2e307f12fce1c198aa3
          path: llm-api
          persist-credentials: false
      - name: Prepare build and test dependencies
        run: |
          rustup component add rustfmt clippy
          cargo fetch --locked
          python3 -m venv "$RUNNER_TEMP/agent-venv"
          "$RUNNER_TEMP/agent-venv/bin/python" -m pip install -r integrations/discord/requirements.txt
      - name: Check formatting and lint all Rust targets
        run: |
          cargo fmt --check
          cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --locked --offline
      - name: Test Discord adapter and queue
        working-directory: agent/integrations/discord
        run: '"$RUNNER_TEMP/agent-venv/bin/python" -m unittest test_bot test_runner'
      - name: Smoke-test the release CLI in a terminal
        if: github.event_name != 'pull_request'
        run: |
          cargo build --release --locked --offline
          python3 tests/sessions.py
      - name: Test Discord and Rust worker quota recovery together
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          test_binary=$(cargo test --locked --offline --bin ag --no-run --message-format=json |
            jq -er 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "ag") | .executable // empty')
          AGENT_TEST_BINARY="$test_binary" PYTHONPATH=integrations/discord \
            "$RUNNER_TEMP/agent-venv/bin/python" -m unittest test_quota_worker
