[package]
name = "agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small terminal coding agent using llm-api"

[dependencies]
llm-api = { path = "../llm-api" }
serde_json = "1"
libc = "0.2"
unicode-segmentation = "1"
unicode-width = "0.2"
termimad = "0.34"

[profile.release]
strip = true
lto = true
